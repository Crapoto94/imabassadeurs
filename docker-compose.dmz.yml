# Déploiement du frontend en DMZ (172.17.1.3) — iambassadeurs.ivry94.fr -> :5311
# Usage : docker compose -f docker-compose.dmz.yml up -d --build
# Flux : DMZ 172.17.1.3 -> 10.103.130.106:5310 (règle FW)
services:
  frontend-dmz:
    build:
      context: .
      dockerfile: dmz/Dockerfile
    restart: always
    ports: ["5311:80"]
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://10.103.130.106:5310}
