server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy same-origin vers le backend : le navigateur n'appelle que son origine
  # (pas de CORS, pas de dépendance à « localhost »).
  location /api/ {
    proxy_pass http://backend:5310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 310s;   # synthèses IA locales : jusqu'à 5 min
    client_max_body_size 10m;  # upload PDF (limite applicative 5 Mo)
  }

  location /uploads/ {
    proxy_pass http://backend:5310;
    proxy_set_header Host $host;
  }

  # Application monopage : toutes les routes retombent sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
