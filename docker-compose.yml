services:
  backend:
    build: { context: ./backend }
    restart: always
    ports: ["5310:5310"]
    env_file: [./backend/.env]
    environment:
      - NODE_ENV=production
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Vide = même origine : Nginx proxifie /api et /uploads vers le backend.
        # Renseigner APP_API_URL uniquement si l'API est sur une autre origine.
        - VITE_API_URL=${APP_API_URL:-}
    restart: always
    ports: ["5311:80"]
    depends_on: [backend]
